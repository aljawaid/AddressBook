---
name: PHP Compatibility

on:
  push:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: php-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    env:
      KANBOARD_VERSION: v1.2.54
      APP_VERSION: 1.2.54
      PLUGIN_NAME: AddressBook

    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          persist-credentials: false

      - name: Checkout Kanboard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kanboard/kanboard
          ref: ${{ env.KANBOARD_VERSION }}
          path: kanboard
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, filter, gd, json, mbstring, openssl, pdo_sqlite, session, simplexml, sqlite3, xml
          coverage: none
          tools: composer:v2

      - name: Test presentation compatibility
        run: php plugin/tests/PresentationCompatibilityTest.php

      - name: Lint all PHP files
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find plugin -type f -name '*.php' -print0)

      - name: Install Kanboard dependencies
        run: composer install --working-dir=kanboard --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Install plugin in Kanboard
        shell: bash
        run: |
          mkdir -p kanboard/plugins
          cp -R plugin "kanboard/plugins/$PLUGIN_NAME"

      - name: Boot plugin with Kanboard
        working-directory: kanboard
        shell: bash
        run: |
          php -d error_reporting=E_ALL -d display_errors=1 <<'PHP'
          <?php
          define("PLUGINS_DIR", getcwd()."/plugins");
          define("DB_FILENAME", getcwd()."/data/ci.sqlite");
          require "app/common.php";
          $pluginName = getenv("PLUGIN_NAME");
          $loaded = $container["pluginLoader"]->getPlugins();
          $incompatible = $container["pluginLoader"]->getIncompatiblePlugins();
          if (isset($incompatible[$pluginName])) {
              fwrite(STDERR, $pluginName." is incompatible with ".APP_VERSION.PHP_EOL);
              exit(1);
          }
          if (! isset($loaded[$pluginName])) {
              fwrite(STDERR, $pluginName." did not load".PHP_EOL);
              exit(1);
          }
          echo $pluginName." loaded on Kanboard ".APP_VERSION." with PHP ".PHP_VERSION.PHP_EOL;
          PHP

      - name: Test global contact directory
        working-directory: kanboard
        run: php plugins/AddressBook/tests/Integration/GlobalDirectoryTest.php

  database-migrations:
    name: Database migrations
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: addressbook
          MYSQL_ROOT_PASSWORD: addressbook
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: addressbook
          POSTGRES_PASSWORD: addressbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none

      - name: Test SQLite migration
        run: php tests/Schema/DatabaseMigrationTest.php

      - name: Test MySQL migration
        env:
          ADDRESS_BOOK_TEST_DRIVER: mysql
          ADDRESS_BOOK_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=addressbook
          ADDRESS_BOOK_TEST_USERNAME: root
          ADDRESS_BOOK_TEST_PASSWORD: addressbook
        run: php tests/Schema/DatabaseMigrationTest.php

      - name: Test PostgreSQL migration
        env:
          ADDRESS_BOOK_TEST_DRIVER: postgres
          ADDRESS_BOOK_TEST_DSN: pgsql:host=127.0.0.1;port=5432;dbname=addressbook
          ADDRESS_BOOK_TEST_USERNAME: postgres
          ADDRESS_BOOK_TEST_PASSWORD: addressbook
        run: php tests/Schema/DatabaseMigrationTest.php
